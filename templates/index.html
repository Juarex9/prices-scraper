<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper en Vivo - v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-xl shadow-xl w-full max-w-lg text-center transition-all" id="main-container">
        
        <div id="search-view">
            <h1 class="text-4xl font-black text-gray-800 mb-2">Fintrack <span class="text-blue-600">Live</span></h1>
            <p class="text-gray-500 mb-8">Demo de Web Scraping en tiempo real</p>

            <form action="/buscar" method="GET" id="search-form">
                <input type="text" name="termino" required placeholder="Ej: fernet, leche, asado..." 
                    class="w-full px-5 py-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg mb-6">
                
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg transition-colors text-lg">
                    Iniciar Extracción en Vivo
                </button>
            </form>
        </div>

        <div id="loading-view" class="hidden py-8">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mx-auto mb-6"></div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">Ejecutando Playwright...</h2>
            <p class="text-gray-500 animate-pulse">Abriendo navegadores y buscando en 5 supermercados. Esto tomará unos segundos.</p>
        </div>

    </div>

    <script>
        // Magia para la presentación: Mostrar loader al enviar el formulario
        document.getElementById('search-form').addEventListener('submit', function() {
            document.getElementById('search-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');
        });
    </script>
</body>
</html>
