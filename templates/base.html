<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Buscador de Precios{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9488;
            --primary-light: #14b8a6;
            --primary-dark: #0f766e;
            --secondary: #f97316;
            --dark: #0f172a;
            --dark-soft: #1e293b;
            --gray-100: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --surface: #ffffff;
            --vea: #cbec0d;
            --carrefour: #005aa0;
            --changomas: #35a319;
            --dia: #d8171e;
            --jumbo: #15b90f;
            --font-display: 'Sora', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
        }
        
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--gray-100);
            color: var(--dark-soft);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        ::selection {
            background: var(--primary);
            color: white;
        }
        
        /* ===== CHAT WIDGET ===== */
        .chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        
        .chat-toggle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary) 0%, #ea580c 100%);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .chat-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(249, 115, 22, 0.4);
        }
        
        .chat-toggle svg {
            width: 28px;
            height: 28px;
            fill: white;
        }
        
        .chat-toggle .close-icon {
            display: none;
        }
        
        .chat-widget.open .chat-toggle .chat-icon {
            display: none;
        }
        
        .chat-widget.open .chat-toggle .close-icon {
            display: block;
        }
        
        .chat-window {
            position: absolute;
            bottom: 75px;
            right: 0;
            width: 380px;
            height: 550px;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }
        
        .chat-widget.open .chat-window {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .chat-header {
            background: var(--dark);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-header-info svg {
            width: 24px;
            height: 24px;
            fill: var(--primary);
        }
        
        .chat-header-title h3 {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
        }
        
        .chat-header-title span {
            font-size: 0.75rem;
            color: var(--gray-400);
        }
        
        .chat-header-actions {
            display: flex;
            gap: 8px;
        }
        
        .chat-header-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .chat-header-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .chat-header-btn svg {
            width: 16px;
            height: 16px;
            fill: white;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .chat-message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            line-height: 1.5;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .chat-message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .chat-message.ai {
            align-self: flex-start;
            background: var(--gray-100);
            color: var(--dark-soft);
            border-bottom-left-radius: 4px;
        }
        
        .chat-message.error {
            align-self: center;
            background: #fee2e2;
            color: #991b1b;
        }
        
        .chat-typing {
            align-self: flex-start;
            padding: 12px 16px;
            background: var(--gray-100);
            border-radius: var(--radius-md);
            display: flex;
            gap: 4px;
        }
        
        .chat-typing span {
            width: 8px;
            height: 8px;
            background: var(--gray-400);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        
        .chat-input-area {
            padding: 12px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 8px;
        }
        
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--gray-300);
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .chat-input-area input:focus {
            border-color: var(--primary);
        }
        
        .chat-send-btn {
            width: 44px;
            height: 44px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        
        .chat-send-btn:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: scale(1.05);
        }
        
        .chat-send-btn:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
        }
        
        .chat-send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .chat-welcome {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-500);
        }
        
        .chat-welcome-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        
        .chat-welcome h4 {
            font-family: var(--font-display);
            color: var(--dark);
            margin-bottom: 8px;
        }
        
        .chat-welcome p {
            font-size: 0.85rem;
            line-height: 1.5;
        }
        
        .chat-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 16px 12px;
        }
        
        .chat-suggestion {
            padding: 6px 12px;
            background: rgba(13, 148, 136, 0.1);
            color: var(--primary-dark);
            border: 1px solid rgba(13, 148, 136, 0.2);
            border-radius: 100px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .chat-suggestion:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        @media (max-width: 480px) {
            .chat-window {
                width: calc(100vw - 40px);
                height: calc(100vh - 120px);
                bottom: 70px;
                right: -10px;
            }
        }
        
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    
    <!-- Chat Widget -->
    <div class="chat-widget" id="chatWidget">
        <button class="chat-toggle" onclick="toggleChat()" title="Asesor IA">
            <svg class="chat-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
            <svg class="close-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        
        <div class="chat-window">
            <div class="chat-header">
                <div class="chat-header-info">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                    <div class="chat-header-title">
                        <h3>ComprIA</h3>
                        <span>Tu asesor de compras</span>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="chat-header-btn" onclick="openFullChat()" title="Abrir en pagina completa">
                        <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                    </button>
                    <button class="chat-header-btn" onclick="clearWidgetChat()" title="Limpiar chat">
                        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="chat-welcome">
                    <div class="chat-welcome-icon">🤖</div>
                    <h4>¡Hola! Soy tu asesor de compras</h4>
                    <p>Contame qué necesitás y te ayudo a encontrar los mejores precios.</p>
                </div>
            </div>
            
            <div class="chat-suggestions">
                <button class="chat-suggestion" onclick="sendWidgetMessage('Tengo un asado para 8 personas')">🥩 Asado para 8</button>
                <button class="chat-suggestion" onclick="sendWidgetMessage('Armame la compra del mes')">📦 Compra del mes</button>
                <button class="chat-suggestion" onclick="sendWidgetMessage('Cena para 2 con $8000')">🍝 Cena para 2</button>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Escribí tu mensaje..." onkeypress="handleWidgetKeypress(event)">
                <button class="chat-send-btn" id="chatSendBtn" onclick="sendWidgetMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let widgetHistory = [];
        let isWidgetLoading = false;
        let preciosCache = [];
        
        const CATEGORY_KEYWORDS = {
            'asado': ['asado', 'vacío', 'matambre', 'chorizo', 'entraña', 'tira', 'bife', 'morcilla', 'chimichurri', 'carbón', 'sal', 'carne', 'cortes'],
            'pollo': ['pollo', 'pechuga', 'muslo', 'ala'],
            'cerdo': ['cerdo', 'chuleta', 'pancetta', 'jamón'],
            'cena': ['fideos', 'pasta', 'salsa', 'arroz', 'pan'],
            'desayuno': ['leche', 'café', 'té', 'pan', 'mermelada', 'manteca', 'cereal', 'yogur', 'tostada'],
            'limpieza': ['lavandina', 'detergente', 'trapo', 'escoba', 'cloro', 'quitagrasa', 'limpieza'],
            'bebidas': ['agua', 'gaseosa', 'jugo', 'vino', 'cerveza', 'bebida', 'refresco'],
            'verdura': ['tomate', 'lechuga', 'cebolla', 'papa', 'zanahoria', 'verdura', 'fruta', 'manzana', 'banana'],
            'lacteos': ['leche', 'queso', 'yogur', 'manteca', 'crema', 'ricota', 'yogur'],
            'alacena': ['arroz', 'fideos', 'aceite', 'sal', 'azúcar', 'harina', 'conserva']
        };
        
        function toggleChat() {
            const widget = document.getElementById('chatWidget');
            widget.classList.toggle('open');
            if (widget.classList.contains('open')) {
                document.getElementById('chatInput').focus();
            }
        }
        
        function openFullChat() {
            window.open('/chat', '_blank');
        }
        
        function clearWidgetChat() {
            if (confirm('¿Limpiar la conversación?')) {
                widgetHistory = [];
                preciosCache = [];
                const container = document.getElementById('chatMessages');
                container.innerHTML = `
                    <div class="chat-welcome">
                        <div class="chat-welcome-icon">🤖</div>
                        <h4>¡Hola! Soy tu asesor de compras</h4>
                        <p>Contame qué necesitás y te ayudo a encontrar los mejores precios.</p>
                    </div>
                `;
            }
        }
        
        function detectCategories(message) {
            const msgLower = message.toLowerCase();
            const terminosDetectados = new Set();
            
            for (const [categoria, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
                for (const keyword of keywords) {
                    if (msgLower.includes(keyword)) {
                        for (const term of keywords) {
                            if (term.length > 2) {
                                terminosDetectados.add(term);
                            }
                        }
                        break;
                    }
                }
            }
            
            return Array.from(terminosDetectados).slice(0, 15);
        }
        
        async function fetchPrices(terminos) {
            if (terminos.length === 0) return [];
            
            try {
                const response = await fetch('/api/ai/consultar-precios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        terminos: terminos,
                        limite_por_termino: 15
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    return data.productos || [];
                }
            } catch (e) {
                console.error('Error fetching prices:', e);
            }
            return [];
        }
        
        function addWidgetMessage(content, role) {
            widgetHistory.push({ role, content });
            
            const container = document.getElementById('chatMessages');
            const welcome = container.querySelector('.chat-welcome');
            if (welcome) welcome.remove();
            
            const div = document.createElement('div');
            div.className = `chat-message ${role === 'user' ? 'user' : 'ai'}`;
            div.innerHTML = content.replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/^- (.+)$/gm, '<br>• $1');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function showWidgetTyping() {
            const container = document.getElementById('chatMessages');
            const typing = document.createElement('div');
            typing.className = 'chat-typing';
            typing.id = 'widgetTyping';
            typing.innerHTML = '<span></span><span></span><span></span>';
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;
        }
        
        function hideWidgetTyping() {
            const typing = document.getElementById('widgetTyping');
            if (typing) typing.remove();
        }
        
        async function sendWidgetMessage(text) {
            const input = document.getElementById('chatInput');
            const message = text || input.value.trim();
            
            if (!message || isWidgetLoading) return;
            
            input.value = '';
            isWidgetLoading = true;
            document.getElementById('chatSendBtn').disabled = true;
            
            addWidgetMessage(message, 'user');
            showWidgetTyping();
            
            const terminos = detectCategories(message);
            let precios_data = [];
            
            if (terminos.length > 0) {
                precios_data = await fetchPrices(terminos);
                if (precios_data.length > 0) {
                    preciosCache = precios_data;
                }
            } else if (preciosCache.length > 0) {
                precios_data = preciosCache;
            }
            
            const context = precios_data.length > 0 ? { precios_data } : null;
            
            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        conversation_history: widgetHistory.filter(m => m.role !== 'system'),
                        context: context
                    })
                });
                
                hideWidgetTyping();
                
                if (!response.ok) {
                    const error = await response.json();
                    addWidgetMessage(error.detail || 'Error al procesar tu mensaje', 'error');
                    return;
                }
                
                const data = await response.json();
                
                if (data.success && data.response) {
                    addWidgetMessage(data.response, 'ai');
                } else {
                    addWidgetMessage(data.error || 'Error desconocido', 'error');
                }
            } catch (error) {
                hideWidgetTyping();
                addWidgetMessage('Error de conexión. Verificá tu internet.', 'error');
            } finally {
                isWidgetLoading = false;
                document.getElementById('chatSendBtn').disabled = false;
            }
        }
        
        function handleWidgetKeypress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendWidgetMessage();
            }
        }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
